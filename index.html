<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bot or Not — Quick Quiz</title>
        <script src="Tailwind.js"></script>
    <style>
        /* Shared quiz colors and motion. */
        :root {
            color-scheme: light;
            --ink: #12243a;
            --muted: #63758b;
            --line: #dbe5ef;
            --blue: #1d5fae;
            --blue-dark: #174b89;
            --blue-pale: #edf5fc;
        }

        body { color: var(--ink); }
        button { -webkit-tap-highlight-color: transparent; }
        .answer { animation: answer-enter 220ms ease-out both; }
        .answer:nth-child(2) { animation-delay: 35ms; }
        .answer:nth-child(3) { animation-delay: 70ms; }
        .answer:nth-child(4) { animation-delay: 105ms; }
        .answer-dismiss { animation: answer-dim 180ms ease-out both; }
        .choice-media { height: min(64vh, 690px, calc(100dvh - 400px)); }
        .question-media-content { height: min(64vh, 690px, calc(100dvh - 400px)); animation: media-enter 260ms ease-out both; }
        @keyframes answer-enter {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes answer-dim {
            to { opacity: .42; }
        }
        @keyframes media-enter {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-height: 700px) {
            .choice-media { height: min(48vh, 336px, calc(100dvh - 310px)); }
            .question-media-content { height: min(48vh, 336px, calc(100dvh - 310px)); }
        }
        @media (max-height: 620px) {
            .quiz-content { padding: 12px !important; }
            #question { margin-top: 10px; font-size: 1.15rem; }
            #question-media { margin-top: 8px; }
            #answers { margin-top: 10px; gap: 8px; }
            #answers .answer { min-height: 48px; padding: 10px; }
            #feedback { margin-top: 8px; padding: 10px; }
            .choice-media { height: min(36vh, 220px, calc(100dvh - 380px)); }
            .question-media-content { height: min(36vh, 220px, calc(100dvh - 380px)); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
    </head>
    <body class="h-dvh min-h-0 flex flex-col overflow-hidden bg-[#edf5fc] text-slate-900 antialiased relative">
        <button id="settings-button" class="fixed top-4 right-4 z-50 px-4 py-2 bg-white text-[#174b89] border border-[#cbdced] shadow-sm font-semibold hover:bg-[#f5f9fd] focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            Settings
        </button>
        <div id="settings-panel" class="hidden fixed top-0 right-0 h-full w-80 max-w-[90vw] bg-white border-l border-[#dbe5ef] shadow-xl z-40 flex-col p-8 space-y-4 text-slate-900">
            <h2 class="text-xl font-bold mb-4">Settings</h2>
            <form class="space-y-6">
                <div>
                    <label class="block font-semibold mb-2">Question Architecture</label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-2">
                            <input id="include-media-input" type="checkbox" name="IncludeMedia">
                            <span>Include Media</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input id="include-text-input" type="checkbox" name="IncludeText">
                            <span>Include Text</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold mb-2">Labels</label>
                    <div id="settings-labels" class="space-y-2">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="permission-group-2" value="read" class="accent-blue-600" checked>
                            <span>If you are seeing, something went wrong</span>
                        </label>
                    </div>
                </div>
                <label class="block font-semibold mb-2">Order</label>
                <div class="flex items-center space-x-2">
                    <label class="flex items-center space-x-2">
                        <input id="random-order-input" type="checkbox" name="permission-group-2" value="read" class="accent-blue-600" checked>
                        <span>Use random Order</span>
                    </label>
                </div>
            </form>
        </div>

        <!------------------------------------------------------------------------------->


        <main class="flex-1 min-h-0 w-full max-w-6xl mx-auto flex items-stretch p-3 sm:p-4 relative z-10 overflow-hidden">
            <div class="relative min-h-0 w-full bg-white ring-1 ring-[#dbe5ef] overflow-hidden flex flex-col">

                <div class="quiz-content min-h-0 p-4 sm:p-5 lg:p-6 flex-1 flex flex-col overflow-hidden">
                    <div class="shrink-0 flex items-center justify-between gap-4 border-b border-[#e7edf4] pb-3">
                        <p class="text-sm font-semibold uppercase tracking-[.12em] text-[#1d5fae]">Frage <span id="questionIndex">1</span><span id="qTotal" class="text-[#8090a3]"></span></p>
                        <p id="question-label" class="text-right text-sm text-[#63758b]">If you are seeing this text, something went wrong :(</p>
                    </div>
                    <p id="question" class="shrink-0 mt-4 text-center text-xl sm:text-2xl font-semibold leading-snug tracking-tight text-[#12243a]"></p>
                    <div id="question-media" class="hidden shrink-0 mt-3 max-w-[1680px] mx-auto w-full"></div>

                    <div id="answers" class="mt-3 min-h-0 grid grid-cols-2 gap-3 sm:gap-4 max-w-[1680px] mx-auto w-full"></div>

                    <div id="feedback" aria-live="polite" class="hidden shrink-0 mt-4 max-w-5xl mx-auto w-full bg-[#edf5fc] border border-[#d6e5f4] p-4 text-sm leading-relaxed text-[#294663]"></div>

                    <div class="shrink-0 mt-auto pt-3 flex justify-end">
                        <button id="nextBtn" class="px-5 py-2.5 bg-[#1d5fae] text-white font-semibold hover:bg-[#174b89] focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 disabled:opacity-45 disabled:cursor-not-allowed transition">
                            Next
                        </button>
                    </div>

                </div>
            </div>
        </main>

        <!------------------------------------------------------------------------------------------------------------------------------------------>
    
        <script src="Questions/Questions.js"></script>
        <script src="Questions/Questions_Test.js"></script>
        <script>
            let questions = window.BOT_OR_NOT_DATA;

            const questionElement = document.getElementById("question");
            const questionMediaElement = document.getElementById("question-media");
            const answersElement = document.getElementById("answers");
            const feedbackElement = document.getElementById("feedback");
            const nextButton = document.getElementById("nextBtn");
            const settingsButton = document.getElementById("settings-button");
            const questionIndexElement = document.getElementById("questionIndex");
            const questionLabelElement = document.getElementById("question-label");
            const settingsPanel = document.getElementById("settings-panel");
            const settingsLabels = document.getElementById("settings-labels");
            const randomOrderInput = document.getElementById("random-order-input");
            const includeMediaInput = document.getElementById("include-media-input");
            const includeTextInput = document.getElementById("include-text-input");
 
            let currentQuestionIndex = 0;
            const minIntervalBetweenQuestions = 5;
            const lastQuestions = [0];

            const videoRegex = /\.mp4$/i;

            let activeLabels = Object.fromEntries(
                questions.flatMap(obj => obj.label).map(label => [label, true])
            );

            let activeArchitectures = {
                text: false,
                media: true
            };

            let doQuestionsInOrder = false;

            function getFilteredQuestions() {
                return window.BOT_OR_NOT_DATA.filter(q =>
                    activeLabels[q.label] &&
                    ((activeArchitectures.media && "media" in q) ||
                    (activeArchitectures.text && !("media" in q)))
                );
            }

            questions = getFilteredQuestions();
            currentQuestionIndex = Math.floor(Math.random() * questions.length);
            lastQuestions[0] = currentQuestionIndex;

            const answerButtonStyles = "answer w-full min-h-16 border border-[#dbe5ef] bg-white text-center px-5 py-4 text-base font-medium text-[#223951] shadow-sm transition-[border-color,background-color,box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:border-[#85add5] hover:bg-[#f7fbff] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            const imageButtonStyles = "answer relative overflow-hidden border border-[#dbe5ef] bg-[#f5f9fd] shadow-sm transition-[border-color,background-color,box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:border-[#85add5] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"

            function createMediaElement(filename, className) {
                const mediaElement = document.createElement(videoRegex.test(filename) ? "video" : "img");
                mediaElement.src = `Resources/${filename}`;
                mediaElement.className = className;
                if (mediaElement.tagName === "VIDEO") {
                    mediaElement.autoplay = true;
                    mediaElement.loop = true;
                    mediaElement.muted = true;
                    mediaElement.playsInline = true;
                }
                return mediaElement;
            }


            function renderQuestion(index) {
                nextButton.disabled = true;
                answersElement.innerHTML = "";
                questionMediaElement.innerHTML = "";
                questionMediaElement.classList.add("hidden");
                feedbackElement.classList.add("hidden");
                nextButton.textContent = "Next";
                questionIndexElement.textContent = index + 1;
                questionElement.textContent = questions[index].question;
                questionLabelElement.textContent = questions[index].label || "";
                if ("answers" in questions[index]) {
                    randomOffset = Math.floor(Math.random() * (questions[index].answers.length));
                    for (let i = 0; i < questions[index].answers.length; i++) {
                        let valueWithOffset = (i + randomOffset) % questions[index].answers.length;
                        const button = document.createElement("button");
                        button.className = answerButtonStyles;
                        button.setAttribute("data-correct", valueWithOffset == 0 ? true : false);
                        button.textContent = questions[index].answers[valueWithOffset];
                        button.onclick = () => choose(button);
                        answersElement.appendChild(button);
                    }
                }
                if ("media" in questions[index]) {
                    randomOffset = Math.floor(Math.random() * (questions[index].media.length));
                    if (questions[index].media.length > 1) {
                        for (let i = 0; i < questions[index].media.length; i++) {
                            let valueWithOffset = (i + randomOffset) % questions[index].media.length;
                            const button = document.createElement("button");
                            button.type = "button";
                            button.className = imageButtonStyles;
                            button.setAttribute("data-correct", valueWithOffset == 0 ? true : false);
                            button.appendChild(createMediaElement(questions[index].media[valueWithOffset], "choice-media block w-full object-contain"));
                            button.onclick = () => choose(button);
                            answersElement.appendChild(button);
                        }
                    } else {
                        questionMediaElement.appendChild(createMediaElement(questions[index].media[0], "question-media-content block w-full object-contain"));
                        questionMediaElement.classList.remove("hidden");
                    }
                }
            }

            function choose(button) {
                if (!nextButton.disabled) return;
                let isCorrect = button.getAttribute("data-correct") === "true";
                answersElement.querySelectorAll("button").forEach(iteratedButton => {
                    const answerIsCorrect = iteratedButton.getAttribute("data-correct") === "true";
                    iteratedButton.disabled = true;
                    if (answerIsCorrect) {
                        iteratedButton.classList.remove("border-[#dbe5ef]");
                        iteratedButton.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-950");
                    }
                    if (iteratedButton === button && !answerIsCorrect) {
                        iteratedButton.classList.remove("border-[#dbe5ef]");
                        iteratedButton.classList.add("border-rose-400", "bg-rose-50", "text-rose-950");
                    }
                    if (iteratedButton !== button && !answerIsCorrect) {
                        iteratedButton.classList.add("answer-dismiss");
                    }
                });
                nextButton.disabled = false;
                nextButton.textContent = "Continue";
                const hasAnswer = !!questions[currentQuestionIndex]?.answers?.length

                feedbackElement.innerHTML = isCorrect
                    ? `Richtig! ${questions[currentQuestionIndex].explanation}`
                    : `Leider Falsch. Die richtige Antwort ist ${hasAnswer ? questions[currentQuestionIndex].answers[0] : "das andere Bild"}. ${questions[currentQuestionIndex].explanation}`;
                feedbackElement.classList.remove("hidden");
            }

            function loadTestQuestions() {
                questions = window.BOT_OR_NOT_TEST;
                activeLabels = Object.fromEntries(
                    questions.flatMap(obj => obj.label).map(label => [label, true])
                );

                renderQuestion(currentQuestionIndex);
            }

            nextButton.addEventListener("click", () => {
                if (doQuestionsInOrder) {
                    currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                } else {
                    currentQuestionIndex = Math.floor(Math.random() * questions.length) % questions.length;
                    while (lastQuestions.includes(currentQuestionIndex)) {
                        currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                    }
                }
                lastQuestions.push(currentQuestionIndex);
                if (lastQuestions.length > minIntervalBetweenQuestions) {
                    lastQuestions.shift();
                }
                renderQuestion(currentQuestionIndex);
            });

            settingsButton.addEventListener("click", () => {
                settingsPanel.classList.toggle("hidden");
                if(settingsPanel.classList.contains("hidden")) {
                    doQuestionsInOrder = !randomOrderInput.checked;
                    activeArchitectures.text = includeTextInput.checked;
                    activeArchitectures.media = includeMediaInput.checked;
                    if (!includeMediaInput.checked && !includeTextInput.checked) {
                        activeArchitectures.text = true;
                        activeArchitectures.media = true;
                    }
                    let findOnetrueLabel = false;
                    for (let label in activeLabels) {
                        const checkbox = document.querySelector(`input[name="${label}"]`);
                        if (checkbox) {
                            activeLabels[label] = checkbox.checked;
                            findOnetrueLabel = findOnetrueLabel || checkbox.checked;
                        }
                    }
                    if (!findOnetrueLabel) {
                        for (let label in activeLabels) {
                            activeLabels[label] = true;
                        }
                    }

                    questions = getFilteredQuestions();

                    renderQuestion(0);
                } else {
                    settingsLabels.innerHTML = ""
                    for (let label in activeLabels) {
                        const labelElement = document.createElement("label");
                        const inputElement = document.createElement("input");
                        const spanElement = document.createElement("span");
                        labelElement.className = "flex items-center space-x-2";
                        inputElement.type = "checkbox";
                        inputElement.name = `${label}`;
                        inputElement.value = label;
                        inputElement.checked = activeLabels[label];
                        spanElement.textContent = label;
                        labelElement.appendChild(inputElement);
                        labelElement.appendChild(spanElement);
                        settingsLabels.appendChild(labelElement);
                    } 
                    randomOrderInput.checked = !doQuestionsInOrder;
                    includeTextInput.checked = activeArchitectures.text;
                    includeMediaInput.checked = activeArchitectures.media;
                }
            });

            renderQuestion(currentQuestionIndex);



        </script>
    </body>
</html>
